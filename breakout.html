<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Retro Breakout</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 20% 20%, #2c2f36, #0a0a0f 70%);
      color: #f4f4f4;
      font-family: 'Press Start 2P', 'Courier New', monospace;
    }

    .frame {
      background: #0d0f1a;
      padding: 24px;
      border: 4px solid #56ffce;
      box-shadow: 0 0 20px rgba(86, 255, 206, 0.3), inset 0 0 10px rgba(86, 255, 206, 0.2);
      border-radius: 12px;
      width: min(96vw, 520px);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: #56ffce;
      text-shadow: 0 0 6px rgba(86, 255, 206, 0.6);
      font-size: 12px;
      letter-spacing: 1px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #56ffce;
      border-radius: 6px;
      background: linear-gradient(180deg, #141827 0%, #090c15 100%);
      box-shadow: 0 0 12px rgba(86, 255, 206, 0.25);
    }

    .status {
      margin-top: 12px;
      color: #9be6ff;
      font-size: 11px;
      line-height: 1.6;
      text-align: center;
    }

    .status strong {
      color: #ffd166;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="header">
      <span id="score">SCORE: 0000</span>
      <span id="lives">LIVES: 03</span>
    </div>
    <canvas id="game" width="480" height="640"></canvas>
    <div class="status">
      ← → 로 패들을 움직이세요. 공이 밑으로 떨어지면 <strong>Game Over</strong>!
    </div>
  </div>

  <script>
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');

    const paddle = {
      width: 80,
      height: 12,
      x: canvas.width / 2 - 40,
      y: canvas.height - 40,
      speed: 6,
      moveLeft: false,
      moveRight: false,
    };

    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 60,
      radius: 7,
      dx: 3,
      dy: -3,
      speed: 3,
    };

    const brickConfig = {
      rows: 6,
      cols: 7,
      width: 60,
      height: 18,
      padding: 8,
      offsetTop: 60,
      offsetLeft: 20,
    };

    let bricks = [];
    let score = 0;
    let lives = 3;
    let isGameOver = false;
    let animationId;

    function resetBricks() {
      bricks = [];
      for (let c = 0; c < brickConfig.cols; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickConfig.rows; r++) {
          const hue = 180 + r * 20;
          bricks[c][r] = {
            x: 0,
            y: 0,
            status: 1,
            color: `hsl(${hue}, 85%, 60%)`,
          };
        }
      }
    }

    function resetBallAndPaddle() {
      paddle.x = canvas.width / 2 - paddle.width / 2;
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 60;
      ball.dx = 3 * (Math.random() > 0.5 ? 1 : -1);
      ball.dy = -3;
    }

    function drawPaddle() {
      ctx.fillStyle = '#ffd166';
      ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
      ctx.fillStyle = '#ff6f61';
      ctx.fillRect(paddle.x + 4, paddle.y + 4, paddle.width - 8, paddle.height - 8);
    }

    function drawBall() {
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = '#56ffce';
      ctx.shadowColor = '#56ffce';
      ctx.shadowBlur = 12;
      ctx.fill();
      ctx.shadowBlur = 0;
      ctx.closePath();
    }

    function drawBricks() {
      for (let c = 0; c < brickConfig.cols; c++) {
        for (let r = 0; r < brickConfig.rows; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickConfig.width + brickConfig.padding) + brickConfig.offsetLeft;
            const brickY = r * (brickConfig.height + brickConfig.padding) + brickConfig.offsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;

            ctx.fillStyle = bricks[c][r].color;
            ctx.fillRect(brickX, brickY, brickConfig.width, brickConfig.height);
            ctx.strokeStyle = '#0d0f1a';
            ctx.lineWidth = 2;
            ctx.strokeRect(brickX, brickY, brickConfig.width, brickConfig.height);
          }
        }
      }
    }

    function drawOverlay(text) {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#56ffce';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '18px "Press Start 2P", monospace';
      ctx.fillText(text, canvas.width / 2, canvas.height / 2);
      ctx.font = '10px "Press Start 2P", monospace';
      ctx.fillText('Press SPACE to restart', canvas.width / 2, canvas.height / 2 + 36);
    }

    function drawScore() {
      scoreEl.textContent = `SCORE: ${score.toString().padStart(4, '0')}`;
      livesEl.textContent = `LIVES: 0${lives}`;
    }

    function collisionDetection() {
      for (let c = 0; c < brickConfig.cols; c++) {
        for (let r = 0; r < brickConfig.rows; r++) {
          const brick = bricks[c][r];
          if (brick.status === 1) {
            if (
              ball.x > brick.x &&
              ball.x < brick.x + brickConfig.width &&
              ball.y > brick.y &&
              ball.y < brick.y + brickConfig.height
            ) {
              ball.dy = -ball.dy;
              brick.status = 0;
              score += 10;
              drawScore();

              const cleared = bricks.every(column => column.every(b => b.status === 0));
              if (cleared) {
                drawOverlay('YOU WIN!');
                cancelAnimationFrame(animationId);
                isGameOver = true;
              }
            }
          }
        }
      }
    }

    function movePaddle() {
      if (paddle.moveLeft && paddle.x > 0) {
        paddle.x -= paddle.speed;
      }
      if (paddle.moveRight && paddle.x + paddle.width < canvas.width) {
        paddle.x += paddle.speed;
      }
    }

    function moveBall() {
      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall collision
      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
        ball.dx = -ball.dx;
      }
      if (ball.y - ball.radius < 0) {
        ball.dy = -ball.dy;
      }

      // Paddle collision
      if (
        ball.y + ball.radius > paddle.y &&
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.width
      ) {
        const hitPos = ((ball.x - paddle.x) / paddle.width - 0.5) * Math.PI / 1.5;
        ball.dx = ball.speed * Math.sin(hitPos) * 4;
        ball.dy = -Math.abs(ball.dy);
      }

      // Bottom collision
      if (ball.y + ball.radius > canvas.height) {
        lives -= 1;
        drawScore();
        if (lives === 0) {
          drawOverlay('GAME OVER');
          isGameOver = true;
          cancelAnimationFrame(animationId);
        } else {
          resetBallAndPaddle();
        }
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBricks();
      drawPaddle();
      drawBall();
    }

    function update() {
      if (isGameOver) return;
      movePaddle();
      moveBall();
      collisionDetection();
      drawScene();
      animationId = requestAnimationFrame(update);
    }

    function restartGame() {
      score = 0;
      lives = 3;
      isGameOver = false;
      resetBallAndPaddle();
      resetBricks();
      drawScore();
      cancelAnimationFrame(animationId);
      update();
    }

    document.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft') paddle.moveLeft = true;
      if (e.code === 'ArrowRight') paddle.moveRight = true;
      if (e.code === 'Space' && isGameOver) restartGame();
    });

    document.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft') paddle.moveLeft = false;
      if (e.code === 'ArrowRight') paddle.moveRight = false;
    });

    document.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = e.clientX - rect.left;
      if (relativeX > 0 && relativeX < canvas.width) {
        paddle.x = relativeX - paddle.width / 2;
      }
    });

    resetBricks();
    drawScore();
    update();
  </script>
</body>
</html>
